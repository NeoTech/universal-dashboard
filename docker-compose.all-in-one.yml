services:
  twm-local:
    build:
      context: .
      dockerfile: docker/Dockerfile.all-in-one
    env_file: .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
      FRONTEND_PORT: "5187"
      TRAEFIK_WEB_PORT: "8080"
      TRAEFIK_ADMIN_PORT: "8081"
      # Optional overrides (defaults come from .env via env_file above)
      # NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
      # NGROK_DOMAIN: "${NGROK_DOMAIN}"
      # AUTH_ENABLED: "${AUTH_ENABLED}"
      # JWT_SECRET: "${JWT_SECRET}"
      # APP_URL: "${APP_URL}"
      # SAML_CALLBACK_URL: "${SAML_CALLBACK_URL}"
      # FLINT_FUNCTION_URL: "${FLINT_FUNCTION_URL}"
      # FLINT_AUTH_EMAIL: "${FLINT_AUTH_EMAIL}"
      # FLINT_AUTH_TOKEN: "${FLINT_AUTH_TOKEN}"
      # STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      # STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "4040:4040"
    restart: unless-stopped