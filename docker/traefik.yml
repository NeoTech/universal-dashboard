# docker/traefik.yml — Traefik v3 static configuration
#
# Loaded by the traefik container via:
#   volumes:
#     - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro

api:
  dashboard: true
  insecure: true          # Traefik dashboard accessible without auth (port 8090)

entryPoints:
  web:
    address: ":80"        # All inbound traffic (ngrok connects here)

providers:
  docker:
    exposedByDefault: false   # Only containers with traefik.enable=true are routed
    network: twm              # Must match the Docker Compose network name

log:
  level: INFO

# Access logs help diagnose routing issues during initial setup
accessLog: {}
