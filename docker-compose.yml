# TWM — Docker Compose stack
#
# Services:
#   api        — Bun API server (port 3001)
#   dashboard  — SolidJS frontend, Vite-built static files (port 8080)
#   traefik    — Reverse proxy; routes /api/* → api, /* → dashboard
#   ngrok      — Public HTTPS tunnel → traefik:80
#   ngrok-url  — Ephemeral helper: prints the public ngrok URL on startup
#
# Quick start:
#   cp .env.example .env   # fill in NGROK_AUTHTOKEN + provider keys
#   docker compose up --build
#
# See docs/docker.md for full setup guide.

networks:
  twm:
    driver: bridge

services:

  # ── API server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # All .env vars are injected at runtime — secrets never baked into the image.
    env_file: .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
    networks:
      - twm
    labels:
      - "traefik.enable=true"
      # Match /api/* and the standalone /health route (higher priority wins)
      - "traefik.http.routers.twm-api.rule=PathPrefix(`/api`) || PathPrefix(`/health`)"
      - "traefik.http.routers.twm-api.entrypoints=web"
      - "traefik.http.routers.twm-api.priority=10"
      - "traefik.http.services.twm-api.loadbalancer.server.port=3001"
    restart: unless-stopped
    # Uncomment to persist auth accounts and poll settings across recreations:
    # volumes:
    #   - ./auth.db:/app/auth.db
    #   - ./poll-settings.json:/app/poll-settings.json

  # ── Static dashboard ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    networks:
      - twm
    labels:
      - "traefik.enable=true"
      # Catch-all — must be lower priority than the api router
      - "traefik.http.routers.twm-dashboard.rule=PathPrefix(`/`)"
      - "traefik.http.routers.twm-dashboard.entrypoints=web"
      - "traefik.http.routers.twm-dashboard.priority=1"
      - "traefik.http.services.twm-dashboard.loadbalancer.server.port=8080"
    restart: unless-stopped

  # ── Traefik reverse proxy ────────────────────────────────────────────────────
  traefik:
    image: traefik:v3
    ports:
      - "80:80"                                    # Main traffic (ngrok tunnels here)
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"     # Traefik dashboard UI
    volumes:
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - twm
    restart: unless-stopped

  # ── Ngrok tunnel ─────────────────────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    entrypoint: ["/bin/sh", "/ngrok-entrypoint.sh"]
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
      NGROK_DOMAIN:    "${NGROK_DOMAIN:-}"
    volumes:
      - ./docker/ngrok-entrypoint.sh:/ngrok-entrypoint.sh:ro
    networks:
      - twm
    depends_on:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/api/tunnels || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
    restart: unless-stopped

  # ── URL printer (exits after printing the public URL) ────────────────────────
  ngrok-url:
    image: oven/bun:1
    depends_on:
      ngrok:
        condition: service_healthy
    networks:
      - twm
    entrypoint: ["bun", "-e"]
    command:
      - |
        const r = await fetch('http://ngrok:4040/api/tunnels');
        const d = await r.json() as { tunnels?: { public_url: string }[] };
        const url = d.tunnels?.[0]?.public_url ?? '(tunnel not ready)';
        console.log('');
        console.log('  ┌─────────────────────────────────────────────┐');
        console.log('  │  TWM is publicly accessible at:             │');
        console.log('  │  ' + url.padEnd(45) + '│');
        console.log('  │                                             │');
        console.log('  │  Webhook base URL:                          │');
        console.log('  │  ' + (url + '/api/webhooks/<provider>').padEnd(45) + '│');
        console.log('  └─────────────────────────────────────────────┘');
        console.log('');
    restart: "no"
